name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get the release version from the tag
        if: env.VERSION == ''
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
      - name: Show the version
        run: |
          echo "version is: $VERSION"
      - name: Check that tag version and Cargo.toml version are the same
        shell: bash
        run: |
          if ! grep -q "version = \"${VERSION#v}\"" Cargo.toml; then
            echo "version does not match Cargo.toml" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$VERSION" --draft --verify-tag --title "$VERSION"
    outputs:
      version: ${{ env.VERSION }}

  build-release:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc: docker/builder.Dockerfile (AlmaLinux 9, glibc 2.34 floor), built natively per arch
          - { target: x86_64-unknown-linux-gnu,   os: ubuntu-latest,    build_tool: bake,  lib: libflyline.so }
          - { target: aarch64-unknown-linux-gnu,  os: ubuntu-24.04-arm, build_tool: bake,  lib: libflyline.so }
          # Linux musl (via cross)
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,    build_tool: cross, lib: libflyline.so }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest,    build_tool: cross, lib: libflyline.so }
          # Android (via cross)
          - { target: aarch64-linux-android,      os: ubuntu-latest,    build_tool: cross, lib: libflyline.so }
          # macOS (native cargo)
          - { target: aarch64-apple-darwin,       os: macos-latest,     build_tool: cargo, lib: libflyline.dylib }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The version pinned in rust-toolchain.toml. `@stable` would install a
      # different toolchain from the one rustup then selects in the repo, and
      # the target would be added to the wrong one.
      - name: Install Rust toolchain
        if: matrix.build_tool != 'bake'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.build_tool == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      - name: Set up Docker Buildx
        if: matrix.build_tool == 'bake'
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.target }}
        if: matrix.build_tool == 'bake'
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: extract-release-artifact
          set: |
            extract-release-artifact.output=type=local,dest=target/${{ matrix.target }}/release

      - name: Build ${{ matrix.target }}
        if: matrix.build_tool != 'bake'
        run: ${{ matrix.build_tool }} build --release --lib --target ${{ matrix.target }}

      - name: Prepare release artifact
        run: |
          ARCHIVE="libflyline-${{ github.ref_name }}-${{ matrix.target }}"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Build archive
        shell: bash
        run: |
          version="${{ needs.create-release.outputs.version }}"
          version_no_v="${version#v}"
          lib_versioned="${{ matrix.lib }}.$version_no_v"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" "target/${{ matrix.target }}/release/$lib_versioned"
          tar czf "$ARCHIVE.tar.gz" -C "target/${{ matrix.target }}/release" "$lib_versioned"
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          echo "ASSET=$ARCHIVE.tar.gz" >> $GITHUB_ENV
          echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" >> $GITHUB_ENV

      - name: Upload release archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${{ needs.create-release.outputs.version }}"
          gh release upload "$version" ${{ env.ASSET }} ${{ env.ASSET_SUM }}

  test-mimalloc-symbols:
    name: test-mimalloc-symbols
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Test mimalloc symbols
        run: |
          docker buildx bake -f docker-bake.hcl test-mimalloc-symbols

  publish-release:
    name: publish-release
    needs: [create-release, build-release, test-mimalloc-symbols]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Upload install.sh to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.version }}" install.sh --clobber
      - name: Mark release as prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.create-release.outputs.version }}" --prerelease --draft=false

  test-installation:
    name: test-installation (${{ matrix.target }})
    needs: [create-release, publish-release]
    # Termux runs on the arm64 runner: Android builds are aarch64 only.
    runs-on: ${{ matrix.target == 'install-test-termux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        target: [install-test-alpine, install-test-ubuntu, install-test-arch, install-test-termux]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Test installation
        env:
          FLYLINE_INSTALL_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          docker buildx bake -f docker-bake.hcl ${{ matrix.target }}


  promote-release:
    name: promote-release
    needs: [create-release, test-installation]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.create-release.outputs.version }}" \
            --repo "${{ github.repository }}" --prerelease=false --latest

  # ── Homebrew tap ────────────────────────────────────────────────────────────────────────────
  # Points aislopware/homebrew-tap's Formula/flyline.rb at the new tag's source archive, which
  # the formula builds from. The tap token lives in the better-update vault (org Jmango Vietnam,
  # project `flyline`, environment `production`, key HOMEBREW_TAP_TOKEN); the only GitHub secret
  # is BETTER_UPDATE_ROBOT, the robot token that opens it. Same arrangement as aislopware/slop-shot.
  #
  # THIS REPO IS PUBLIC: every line this job prints is public. Each value pulled from the vault is
  # masked with `::add-mask::` before anything can echo it, and no secret crosses a step boundary.
  homebrew-tap:
    name: Bump aislopware/homebrew-tap
    needs: [create-release, promote-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # The vault client finds its project from eas.json's projectId, so `env pull` must run in
      # the checkout; outside it, it exits 4 with "Project not linked".
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pull the tap token from the vault and push the bump
        env:
          BETTER_UPDATE_ROBOT: ${{ secrets.BETTER_UPDATE_ROBOT }}
          TAG: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${BETTER_UPDATE_ROBOT}" ]; then
            echo "::error::secret BETTER_UPDATE_ROBOT is not set; see the comment above this job"
            exit 1
          fi

          # A standalone binary; with no BETTER_UPDATE_VERSION it installs the latest release.
          curl -fsSL https://raw.githubusercontent.com/aislopware/better-update/main/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"

          # `env pull --stdout` prints `export KEY='value'` lines; mask every value first.
          vault="${RUNNER_TEMP}/vault.sh"
          better-update env pull --environment production --stdout > "${vault}"
          while IFS= read -r line; do
            case "${line}" in export\ *) ;; *) continue ;; esac
            value="${line#*=}"
            value="${value#\'}"
            value="${value%\'}"
            [ -n "${value}" ] && echo "::add-mask::${value}"
          done < "${vault}"
          # shellcheck disable=SC1090
          . "${vault}"
          rm -f "${vault}"
          token="${HOMEBREW_TAP_TOKEN:?HOMEBREW_TAP_TOKEN is not in the better-update vault}"

          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          sha="$(curl -fsSL --retry 3 "${url}" | sha256sum | cut -d' ' -f1)"
          [ "${#sha}" -eq 64 ] || { echo "::error::could not hash ${url}"; exit 1; }

          git clone --depth 1 "https://x-access-token:${token}@github.com/aislopware/homebrew-tap.git" tap
          cd tap
          sed -i -E "s|^  url \".*\"|  url \"${url}\"|; s|^  sha256 \".*\"|  sha256 \"${sha}\"|" Formula/flyline.rb
          # A sed that matches nothing still succeeds: read the result back.
          if ! grep -qxF "  url \"${url}\"" Formula/flyline.rb \
            || ! grep -qxF "  sha256 \"${sha}\"" Formula/flyline.rb; then
            echo "::error::Formula/flyline.rb no longer has one-line url/sha256 entries"
            exit 1
          fi
          git config user.name "flyline-release"
          git config user.email "release@flyline.invalid"
          # Re-running for the same tag leaves the file unchanged: nothing to push is success.
          if git diff --quiet; then
            echo "Formula/flyline.rb is already at ${TAG}"
          else
            git commit -am "flyline ${TAG#v}"
            git push
          fi
