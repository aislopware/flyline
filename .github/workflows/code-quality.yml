---
name: Code Quality
run-name: Code Quality

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Restrict default permissions for all jobs to read-only
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5

jobs:
  build:
    name: Check Code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Same version as rust-toolchain.toml, so this gate and local clippy agree.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: code-quality

      - name: Check Code
        run: |
          # No --all: that would also format the vendored path dependencies.
          cargo fmt                                                       -- --check
          cargo clippy --workspace --locked --quiet --all-features --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" \
          cargo doc    --workspace --locked --quiet --no-deps --document-private-items

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear@1.14.0

      - name: Check for unused dependencies
        run: cargo shear

  unit-tests:
    # Linux runs flyline's lib tests in Docker (ci.yml, glibc floor); this job
    # adds macOS, where the Homebrew build runs, and the vendored forks' own
    # tests, which no other job runs.
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"

      - uses: Swatinem/rust-cache@v2
        with:
          key: unit-tests
          workspaces: |
            .
            vendor/ratatui
            vendor/termina

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.150

      - name: flyline lib tests
        if: runner.os == 'macOS'
        run: cargo nextest run --workspace --lib --locked

      - name: Vendored ratatui and termina tests
        run: |
          (cd vendor/ratatui && cargo nextest run -p ratatui-core -p ratatui-termina --lib --locked)
          (cd vendor/termina && cargo nextest run --lib --locked)

  msrv:
    name: Check MSRV (1.91)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.91

      - name: Check advertised minimum Rust version
        # rust-toolchain.toml pins 1.100.0 for the workspace; this job must
        # override it explicitly or rustup follows the file and the check
        # below runs on the pinned version instead of exercising the MSRV.
        env:
          RUSTUP_TOOLCHAIN: "1.91.0"
        run: |
          rustc --version | grep -E '^rustc 1[.]91[.]0 '
          cargo check --workspace --locked --all-targets
