version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # termina still requires parking_lot ^0.12, so 0.13 would link two copies
      # of the lock crates and raise the MSRV to 1.95; see the parking_lot line
      # in Cargo.toml.
      - dependency-name: "parking_lot"
        versions: [">=0.13"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      gha-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    ignore:
      # Every Ubuntu tag is chosen on purpose and explained in its Dockerfile:
      # 16.04 is the glibc 2.23 floor the release library targets, 22.04 is
      # the older-LTS install test, and the bash-version images need a GCC
      # that still compiles bash 3.2/4.4. Bump them by hand.
      - dependency-name: "ubuntu"
