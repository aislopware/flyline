version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    # The vendored forks' manifests are updated with their upstreams
    # (vendor/README.md), not one dependency at a time.
    exclude-paths:
      - "vendor/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # termina still requires parking_lot ^0.12, so 0.13 would link two copies
      # of the lock crates and raise the MSRV to 1.95; see the parking_lot line
      # in Cargo.toml.
      - dependency-name: "parking_lot"
        versions: [">=0.13"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      gha-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    ignore:
      # Every Ubuntu tag is chosen on purpose and explained in its Dockerfile:
      # 22.04 is the oldest-LTS install test and the bash-version image needs
      # a GCC that still compiles bash 5.1. Bump them by hand.
      - dependency-name: "ubuntu"
      # docker/builder.Dockerfile's AlmaLinux 9 is the glibc 2.34 floor of
      # every Linux release build; a major bump raises it.
      - dependency-name: "almalinux"
        update-types: ["version-update:semver-major"]
