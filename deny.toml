# `cargo deny check` runs in .github/workflows/supply-chain.yml. Every target
# triple is in the graph, so Linux-, Android- and macOS-only crates are all
# checked.

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Exactly the licences the dependency tree needs; cargo-deny warns when one
# stops being used. Crates offering a choice (MIT OR Apache-2.0, …) are
# satisfied by one of these, so their other options need no entry.
allow = [
    "Apache-2.0",
    "MIT",
    "MPL-2.0",     # termina, option-ext (dirs)
    "Unicode-3.0", # unicode-ident
    "Zlib",        # foldhash
]

[licenses.private]
# flyline and flycontent are `publish = false`; their licence is in
# LICENSE-MIT / LICENSE-GPLv3 and the README, not a crates.io field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (flybuffer, flycontent) carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The ratatui, termina, skim and flycomp forks are vendored under vendor/.
# Nothing may come from git.
allow-git = []
